<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!--
    Local placeholder background (illustration of a green park with a jogger).
    Replace with a real photo if you like: see README, section "Background image".
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9d8"/>
      <stop offset="0.55" stop-color="#e9f3dc"/>
      <stop offset="1" stop-color="#f6efd6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fff0b8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff0b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d3a2"/><stop offset="1" stop-color="#8bc08a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb27a"/><stop offset="1" stop-color="#4f9a64"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8a56"/><stop offset="1" stop-color="#2f6f45"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7447"/><stop offset="1" stop-color="#1f5636"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1380" cy="330" r="360" fill="url(#sun)"/>
  <circle cx="1380" cy="330" r="64" fill="#fff8dc"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.65">
    <ellipse cx="420" cy="210" rx="150" ry="30"/><ellipse cx="520" cy="190" rx="100" ry="30"/>
    <ellipse cx="1620" cy="150" rx="130" ry="24"/><ellipse cx="1700" cy="132" rx="80" ry="24"/>
  </g>

  <!-- far hills -->
  <path d="M0 620 C220 540 420 540 640 600 C860 660 1040 520 1280 540 C1520 560 1700 620 1920 560 L1920 1080 L0 1080Z" fill="url(#hill1)"/>
  <!-- mid hills -->
  <path d="M0 720 C260 640 520 680 760 720 C1020 760 1240 650 1500 670 C1700 686 1820 730 1920 710 L1920 1080 L0 1080Z" fill="url(#hill2)"/>

  <!-- distant trees -->
  <g fill="#3f8a56" opacity="0.9">
    <g transform="translate(180 690)"><rect x="-4" y="30" width="8" height="40" fill="#5b4a36"/><circle cx="0" cy="10" r="46"/><circle cx="-26" cy="34" r="30"/><circle cx="28" cy="34" r="30"/></g>
    <g transform="translate(330 705)"><rect x="-3" y="24" width="6" height="32" fill="#5b4a36"/><circle cx="0" cy="8" r="34"/><circle cx="-20" cy="26" r="22"/><circle cx="22" cy="26" r="22"/></g>
    <g transform="translate(1540 690)"><rect x="-4" y="30" width="8" height="40" fill="#5b4a36"/><circle cx="0" cy="10" r="48"/><circle cx="-28" cy="34" r="30"/><circle cx="30" cy="34" r="30"/></g>
    <g transform="translate(1700 712)"><rect x="-3" y="22" width="6" height="30" fill="#5b4a36"/><circle cx="0" cy="8" r="32"/><circle cx="-20" cy="24" r="21"/><circle cx="20" cy="24" r="21"/></g>
  </g>

  <!-- near hill + path -->
  <path d="M0 820 C300 760 620 800 900 830 C1200 862 1500 790 1920 800 L1920 1080 L0 1080Z" fill="url(#hill3)"/>
  <path d="M0 960 C400 930 800 960 1200 940 C1500 925 1750 935 1920 925 L1920 1080 L0 1080Z" fill="url(#grass)"/>
  <!-- running path -->
  <path d="M-40 1010 C300 930 700 900 1120 880 C1420 866 1700 880 1960 900 L1960 960 C1700 944 1420 934 1120 944 C720 962 360 1010 -40 1080Z" fill="#e9dcc0" opacity="0.92"/>
  <path d="M-40 1030 C300 960 700 925 1120 905 C1420 892 1700 905 1960 922" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-dasharray="18 22"/>

  <!-- jogger silhouette -->
  <g transform="translate(980 760) scale(1.25)" fill="none" stroke="#1d4a31" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="52" cy="-20" r="15" fill="#1d4a31" stroke="none"/>
    <path d="M44 6 L34 62"/>                 <!-- torso -->
    <path d="M44 14 L72 30 L96 20"/>         <!-- front arm -->
    <path d="M42 18 L16 34 L2 18"/>          <!-- back arm -->
    <path d="M34 62 L66 86 L58 124"/>        <!-- front leg -->
    <path d="M34 62 L8 92 L-18 84"/>         <!-- back leg -->
  </g>
  <ellipse cx="1000" cy="948" rx="90" ry="9" fill="#000" opacity="0.12"/>

  <!-- foreground trees -->
  <g>
    <g transform="translate(110 760)"><rect x="-10" y="60" width="20" height="150" fill="#4a3a2a"/><circle cx="0" cy="20" r="110" fill="#2b6d44"/><circle cx="-70" cy="80" r="70" fill="#2f7a4a"/><circle cx="76" cy="84" r="72" fill="#2f7a4a"/></g>
    <g transform="translate(1800 740)"><rect x="-10" y="60" width="20" height="170" fill="#4a3a2a"/><circle cx="0" cy="20" r="120" fill="#2b6d44"/><circle cx="-78" cy="84" r="76" fill="#2f7a4a"/><circle cx="80" cy="90" r="76" fill="#2f7a4a"/></g>
  </g>
</svg>
